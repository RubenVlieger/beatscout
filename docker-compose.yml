version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev-secret-key-change-in-production}
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - beatscout-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/beatscout
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - SOUNDCLOUD_CLIENT_ID=${SOUNDCLOUD_CLIENT_ID:-}
      - SOUNDCLOUD_CLIENT_SECRET=${SOUNDCLOUD_CLIENT_SECRET:-}
      - SOUNDCLOUD_REDIRECT_URI=http://localhost:3000/api/auth/callback/soundcloud
      - DEBUG=true
      - PYTHONPATH=/app:/app/src
    volumes:
      # Mount the CLAP analysis module
      - ./src/analyse:/app/src/analyse:ro
      # Mount models directory
      - ./models:/app/models:ro
      # Mount source for hot reload in development
      - ./backend/app:/app/app:ro
    depends_on:
      - db
    networks:
      - beatscout-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=beatscout
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - beatscout-network

volumes:
  postgres_data:

networks:
  beatscout-network:
    driver: bridge
