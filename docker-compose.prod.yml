services:
  backend:
    image: ghcr.io/rubenvlieger/beatscout-backend:latest
    container_name: beatscout-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      - DATABASE_URL=postgresql+asyncpg://rubenvlieger:rubenvlieger1234catlightcalculatorbackflip@db:5432/beatscout
      - JWT_SECRET_KEY=rubenvlieger1234catlightcalculatorbackflip
      - SOUNDCLOUD_CLIENT_ID=${SOUNDCLOUD_CLIENT_ID:-}
      - SOUNDCLOUD_CLIENT_SECRET=${SOUNDCLOUD_CLIENT_SECRET:-}
      - SOUNDCLOUD_REDIRECT_URI=http://beatscout.rubenvlieger.nl/api/auth/callback/soundcloud
      - DEBUG=false
      - PYTHONPATH=/app:/app/src
    depends_on:
      - db
    networks:
      - beatscout-network
      - web-proxy
    restart: always
    deploy:
      resources:
        limits:
          memory: 300M
  frontend:
    image: ghcr.io/rubenvlieger/beatscout-frontend:latest
    container_name: beatscout-frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://beatscout.rubenvlieger.nl/api # Tells your UI where the backend is
    networks:
      - web-proxy
    restart: always

  db:
    image: postgres:15-alpine
    container_name: beatscout-db
    environment:
      - POSTGRES_USER=rubenvlieger
      - POSTGRES_PASSWORD=rubenvlieger1234catlightcalculatorbackflip
      - POSTGRES_DB=beatscout
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - beatscout-network
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    deploy:
      resources:
        limits:
          memory: 200M

volumes:
  postgres_data:


networks:
  beatscout-network:
    driver: bridge
  web-proxy:
    external: true
