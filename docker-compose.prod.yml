version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/beatscout
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - SOUNDCLOUD_CLIENT_ID=${SOUNDCLOUD_CLIENT_ID:-}
      - SOUNDCLOUD_CLIENT_SECRET=${SOUNDCLOUD_CLIENT_SECRET:-}
      - SOUNDCLOUD_REDIRECT_URI=http://localhost:3000/api/auth/callback/soundcloud
      - DEBUG=false
      - PYTHONPATH=/app:/app/src
    depends_on:
      - db
    networks:
      - beatscout-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 300M

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=beatscout
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - beatscout-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 200M

volumes:
  postgres_data:

networks:
  beatscout-network:
    driver: bridge
