name: beatscout
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.11
  
  # Core PyTorch
  - pytorch=2.2.2
  - torchvision=0.17.2
  - torchaudio=2.2.2
  
  # Heavy C-Dependencies (Conda pre-built binaries)
  - numba
  - llvmlite
  - librosa
  - scipy>=1.15.0
  - numpy>=1.24.2
  - pandas>=2.2.0
  - scikit-learn
  - h5py
  - pysoundfile   # <--- Updated name for Conda!

  # Standard Tools
  - tqdm
  - regex
  - wget

  # Install the rest via pip
  - pip
  - pip:
      - torch==2.2.2
      - torchaudio==2.2.2
      - torchvision==0.17.2
      - torchlibrosa
      - ftfy
      - braceexpand
      - webdataset
      - wandb
      - transformers>=4.51.3
      - progressbar2
      - laion-clap
      - muq
      - qwen-omni-utils
      - audioread
      - openai>=1.52.0