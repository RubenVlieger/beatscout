# version: '3.9' (obsolete)

services:
  frontend:
    build:
      context: ./frontend
      target: development
    volumes:
      # Mount source code for hot reload (use delegated to reduce sync overhead)
      - ./frontend:/app:delegated
      # Use container's node_modules (don't overwrite with host)
      - frontend_node_modules:/app/node_modules
    command: npm run dev
    environment:
      - NODE_ENV=development

volumes:
  frontend_node_modules:
